plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// 保留 Kotlin 方法参数名到字节码，供 Room kapt 正确匹配 :param 占位符
kapt {
    arguments {
        arg("javaParameters", "true")
    }
}

android {
    namespace 'com.unicorn.player'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.unicorn.player"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.name == 'debug') {
                outputFileName = "${rootProject.name}_${variant.name}_${variant.versionName}.apk"
            } else {
                outputFileName = "${rootProject.name}_${variant.versionName}_${new Date().format('yyMMdd')}.apk"
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword 'Pro_365zm'
            keyAlias 'relkey'
            keyPassword 'Pro_365zm'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_1_8
        }
    }
    viewBinding {
        enabled true
    }
}

tasks.register('cleanApp', Delete) {
    delete getLayout().getBuildDirectory()
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.room:room-runtime:2.5.1'
    implementation 'androidx.room:room-ktx:2.5.1'
    kapt 'androidx.room:room-compiler:2.5.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // DataStore依赖
    implementation 'androidx.datastore:datastore-core:1.0.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // SmartRefreshLayout - 下拉刷新和广告展示
    implementation  'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'      //核心必须依赖
    implementation  'io.github.scwang90:refresh-header-classics:3.0.0-alpha'    //经典刷新头
    implementation  'io.github.scwang90:refresh-header-radar:3.0.0-alpha'       //雷达刷新头
    implementation  'io.github.scwang90:refresh-header-falsify:3.0.0-alpha'     //虚拟刷新头
    implementation  'io.github.scwang90:refresh-header-material:3.0.0-alpha'    //谷歌刷新头
    implementation  'io.github.scwang90:refresh-header-two-level:3.0.0-alpha'   //二级刷新头
    implementation  'io.github.scwang90:refresh-footer-ball:3.0.0-alpha'        //球脉冲加载
    implementation  'io.github.scwang90:refresh-footer-classics:3.0.0-alpha'    //经典加载

    implementation 'com.github.bifan-wei:LrcView:V1.4'

    // OkHttp - 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson - JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.github.zcweng:switch-button:0.0.3@aar'

    implementation 'com.github.houbb:opencc4j:1.14.0'

    // 拼音转换：中文专辑名按拼音首字母分组（啊→A）
    implementation 'com.belerweb:pinyin4j:2.5.1'

    implementation 'com.github.nanchen2251:WaveSideBar:1.0.6'
}
